name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Setup npm with Trusted Publishing support
        run: npm install --global npm@11.7.0

      - name: Verify release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi

          case "$package_version" in
            *-*)
              npm_tag="next"
              expected_prerelease="true"
              ;;
            *)
              npm_tag="latest"
              expected_prerelease="false"
              ;;
          esac

          if [ "$RELEASE_PRERELEASE" != "$expected_prerelease" ]; then
            echo "GitHub prerelease state does not match package version $package_version" >&2
            exit 1
          fi

          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Verify package
        run: pnpm run verify:pack

      - name: Publish package
        env:
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        run: npm publish --access public --provenance --tag "$NPM_TAG"
